<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Anamnese</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#e3f2fd,#eceff1);
  padding:20px;
}
form{
  max-width:1000px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h1,h2{
  color:#0d47a1;
}
label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:6px;
  border:1px solid #b0bec5;
}
textarea{resize:vertical}
.group{
  display:flex;
  gap:20px;
  margin-top:8px;
  flex-wrap:wrap;
}
.group label{font-weight:normal}
section{margin-bottom:40px}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#1976d2,#64b5f6);
  margin-top:15px;
}
.download{
  background:linear-gradient(135deg,#455a64,#90a4ae);
}
@media print{.btn{display:none}}
</style>
</head>

<body>

<form id="form">

<!-- TELA 1 -->
<section>
<h1>Anamnese</h1>
</section>

<!-- TELA 2 -->
<section>
<h2>Dados Pessoais</h2>

<label>Nome *</label>
<input required>

<label>RG</label>
<input>

<label>CPF *</label>
<input id="cpf" required>

<label>Data de Nascimento *</label>
<input type="date" required>

<label>Estado Civil</label>
<input>

<label>Endereço</label>
<input>

<label>CEP</label>
<input id="cep">

<label>Bairro</label>
<input>

<label>Cidade</label>
<input>

<label>Telefone *</label>
<input id="tel" required>

<label>Email *</label>
<input type="email" required>

<label>Profissão</label>
<input>

<label>Cargo</label>
<input>

<label>Escolaridade</label>
<input>

<label>Queixa principal – por que buscou a terapia?</label>
<textarea rows="4"></textarea>
</section>

<!-- TELA 3 -->
<section>
<h2>Relacionamentos</h2>

<label>Estado civil</label>
<div class="group">
<label><input type="radio" name="civil"> Casado</label>
<label><input type="radio" name="civil"> Solteiro</label>
<label><input type="radio" name="civil"> Divorciado</label>
</div>

<label>Tem filhos?</label>
<div class="group">
<label><input type="radio" name="filhos"> Sim</label>
<label><input type="radio" name="filhos"> Não</label>
</div>

<label>Quantos?</label>
<input type="number">

<label>Como é o relacionamento com eles?</label>
<textarea></textarea>

<label>Como é o relacionamento com o parceiro(a)?</label>
<textarea></textarea>

<label>Como se sente em casa?</label>
<textarea></textarea>

<label>Como se sente no trabalho?</label>
<textarea></textarea>

<label>Como se sente no contexto social?</label>
<textarea></textarea>

<label>Contexto religioso</label>
<textarea></textarea>

<label>Frustrações</label>
<div class="group">
<label><input type="checkbox"> Pais</label>
<label><input type="checkbox"> Irmãos</label>
<label><input type="checkbox"> Filhos</label>
<label><input type="checkbox"> Profissão</label>
<label><input type="checkbox"> Cônjuge</label>
<label><input type="checkbox"> Identidade sexual</label>
<label><input type="checkbox"> Vida sexual</label>
</div>
</section>

<!-- TELA 4 -->
<section>
<h2>Sexualidade</h2>

<label>Idade da iniciação sexual</label>
<input type="number">

<label>Como foi?</label>
<div class="group">
<label><input type="radio" name="sex"> Traumático</label>
<label><input type="radio" name="sex"> Normal</label>
<label><input type="radio" name="sex"> Bom</label>
</div>

<label>Problemas relacionados ao sexo?</label>
<input>

<label>Realização sexual</label>
<div class="group">
<label><input type="radio" name="real"> Sim</label>
<label><input type="radio" name="real"> Não</label>
</div>

<label>Importância do sexo</label>
<div class="group">
<label><input type="radio" name="imp"> Importante</label>
<label><input type="radio" name="imp"> Muito importante</label>
<label><input type="radio" name="imp"> Sem importância</label>
</div>
</section>

<!-- TELA 5 -->
<section>
<h2>Saúde Emocional</h2>

<label>Trauma?</label>
<input>

<label>Fobia?</label>
<input>

<label>Medo?</label>
<input>

<label>Uso de drogas?</label>
<input>

<label>Insônia? Frequência</label>
<input>

<label>Ideias suicidas?</label>
<input>

<label>Bebidas alcoólicas? Frequência</label>
<input>

<label>Fumante? Tempo</label>
<input>

<label>Nível de estresse</label>
<select>
<option>Alto</option>
<option>Médio</option>
<option>Baixo</option>
</select>

<label>Medicação em uso?</label>
<input>

<label>Já passou por psicólogo ou psiquiatra?</label>
<div class="group">
<label><input type="radio"> Sim</label>
<label><input type="radio"> Não</label>
</div>

<label>Já foi diagnosticado?</label>
<div class="group">
<label><input type="radio"> Sim</label>
<label><input type="radio"> Não</label>
</div>

<label>Tem muitos amigos?</label>
<div class="group">
<label><input type="radio"> Sim</label>
<label><input type="radio"> Não</label>
</div>

<label>Passatempo preferido</label>
<input>

<label>Como as pessoas te descrevem?</label>
<textarea></textarea>

<label>Você se considera feliz? Por quê?</label>
<textarea></textarea>

<label>O que mudaria no seu comportamento?</label>
<textarea></textarea>
</section>

<!-- TELA 6 -->
<section>
<h2>História Familiar e Infância</h2>

<label>O que é a vida para você?</label>
<textarea></textarea>

<label>Foi criado pelos pais?</label>
<div class="group">
<label><input type="radio"> Sim</label>
<label><input type="radio"> Não</label>
</div>

<label>Relação com o pai</label>
<textarea></textarea>

<label>Relação com a mãe</label>
<textarea></textarea>

<label>Eram agressivos?</label>
<div class="group">
<label><input type="radio"> Sim</label>
<label><input type="radio"> Não</label>
</div>

<label>Qual era mais bravo?</label>
<div class="group">
<label><input type="radio"> Pai</label>
<label><input type="radio"> Mãe</label>
</div>

<label>Relacionamento entre eles</label>
<select>
<option>Muito bom</option>
<option>Bom</option>
<option>Regular</option>
<option>Péssimo</option>
</select>

<label>Possui irmãos? Quantos?</label>
<input>

<label>Relação com irmãos</label>
<select>
<option>Ótima</option>
<option>Boa</option>
<option>Ruim</option>
</select>

<label>Criança introvertida ou extrovertida?</label>
<select>
<option>Introvertida</option>
<option>Extrovertida</option>
</select>

<label>Medos da infância</label>
<textarea></textarea>

<label>Medos atuais</label>
<textarea></textarea>
</section>

<!-- TELA 7 -->
<section>
<h2>Sentimentos Atuais</h2>

<label>Sentimentos mais comuns hoje</label>
<textarea rows="5"></textarea>
</section>

<!-- TELA FINAL -->
<section>
<h2>Finalização</h2>
<button class="btn">Enviar Anamnese</button>
<button type="button" onclick="window.print()" class="btn download">
Download / Imprimir
</button>
</section>

</form>

<script>
function mask(id,pattern){
  document.getElementById(id).addEventListener("input",e=>{
    let v=e.target.value.replace(/\D/g,"");
    e.target.value=v.replace(pattern,"$1.$2.$3-$4");
  });
}
mask("cpf",/(\d{3})(\d{3})(\d{3})(\d{2})/);

document.getElementById("tel").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/\D/g,"")
  .replace(/(\d{2})(\d)/,"($1) $2")
  .replace(/(\d{5})(\d)/,"$1-$2");
});

document.getElementById("cep").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/\D/g,"")
  .replace(/(\d{5})(\d)/,"$1-$2");
});

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  alert("Anamnese validada com sucesso!");
});
</script>

</body>
</html>
