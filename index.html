<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Anamnese</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e6ecf3, #cfd9e8);
  margin: 0;
  padding: 0;
}
.container {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,.15);
}
h1, h2 {
  color: #2c5aa0;
  text-align: center;
}
.step { display: none; }
.step.active { display: block; }

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
  color: #333;
}
input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
textarea { min-height: 80px; }

.radio-group, .check-group {
  margin-top: 8px;
}
.radio-group label, .check-group label {
  font-weight: normal;
  display: inline-block;
  margin-right: 15px;
}

.buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #2c5aa0;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}
button.secondary {
  background: #b0b7c3;
  color: #333;
}
button:hover { opacity: .9; }

.progress {
  height: 6px;
  background: #ddd;
  border-radius: 5px;
  margin-bottom: 20px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2c5aa0, #4f8bd6);
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">
  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <!-- TELA 1 -->
  <div class="step active">
    <h1>Anamnese</h1>
    <p style="text-align:center">
      Este formulário é confidencial e tem como objetivo compreender melhor sua história.
    </p>
    <div class="buttons">
      <span></span>
      <button onclick="next()">Iniciar</button>
    </div>
  </div>

  <!-- TELA 2 – DADOS PESSOAIS -->
  <div class="step">
    <h2>Dados Pessoais</h2>

    <label>Nome completo *</label>
    <input required>

    <label>RG</label>
    <input>

    <label>CPF *</label>
    <input id="cpf" required>

    <label>Data de nascimento *</label>
    <input type="date" required>

    <label>Estado civil</label>
    <select>
      <option></option>
      <option>Solteiro(a)</option>
      <option>Casado(a)</option>
      <option>Divorciado(a)</option>
    </select>

    <label>Endereço</label>
    <input>

    <label>CEP</label>
    <input id="cep">

    <label>Bairro</label>
    <input>

    <label>Cidade</label>
    <input>

    <label>Telefone *</label>
    <input id="tel" required>

    <label>Email *</label>
    <input type="email" required>

    <label>Profissão</label>
    <input>

    <label>Cargo</label>
    <input>

    <label>Escolaridade</label>
    <input>

    <label>Queixa principal – por que buscou terapia?</label>
    <textarea></textarea>

    <div class="buttons">
      <button class="secondary" onclick="prev()">Voltar</button>
      <button onclick="next()">Próximo</button>
    </div>
  </div>

  <!-- TELA 3 – RELACIONAMENTOS -->
  <div class="step">
    <h2>Relacionamentos</h2>

    <label>Tem filhos?</label>
    <div class="radio-group">
      <label><input type="radio" name="filhos"> Sim</label>
      <label><input type="radio" name="filhos"> Não</label>
    </div>

    <label>Quantos?</label>
    <input type="number">

    <label>Como é o relacionamento com eles?</label>
    <textarea></textarea>

    <label>Como é o relacionamento com o parceiro(a)?</label>
    <textarea></textarea>

    <label>Como se sente em casa?</label>
    <textarea></textarea>

    <label>Como se sente no trabalho?</label>
    <textarea></textarea>

    <label>Como se sente no contexto social?</label>
    <textarea></textarea>

    <label>Como se sente no contexto religioso?</label>
    <textarea></textarea>

    <div class="buttons">
      <button class="secondary" onclick="prev()">Voltar</button>
      <button onclick="next()">Próximo</button>
    </div>
  </div>

  <!-- TELA 4 – SAÚDE EMOCIONAL -->
  <div class="step">
    <h2>Saúde Emocional</h2>

    <label>Algum trauma?</label>
    <textarea></textarea>

    <label>Alguma fobia?</label>
    <textarea></textarea>

    <label>Usa drogas?</label>
    <textarea></textarea>

    <label>Insônia? Frequência?</label>
    <textarea></textarea>

    <label>Ideias suicidas?</label>
    <textarea></textarea>

    <label>Consumo de álcool?</label>
    <textarea></textarea>

    <label>É fumante?</label>
    <textarea></textarea>

    <label>Nível de estresse</label>
    <select>
      <option>Baixo</option>
      <option>Médio</option>
      <option>Alto</option>
    </select>

    <div class="buttons">
      <button class="secondary" onclick="prev()">Voltar</button>
      <button onclick="next()">Próximo</button>
    </div>
  </div>

  <!-- TELA FINAL -->
  <div class="step">
    <h2>Finalizado</h2>
    <p style="text-align:center">
      Obrigado por responder. Você pode baixar suas respostas abaixo.
    </p>

    <div class="buttons">
      <button onclick="download()">⬇️ Baixar respostas</button>
    </div>
  </div>

</div>

<script>
let step = 0;
const steps = document.querySelectorAll('.step');
const progress = document.getElementById('progress');

function showStep() {
  steps.forEach((s,i)=>s.classList.toggle('active', i===step));
  progress.style.width = ((step)/(steps.length-1))*100 + '%';
}
function next() {
  if(step < steps.length-1) step++;
  showStep();
}
function prev() {
  if(step > 0) step--;
  showStep();
}

function download() {
  const data = {};
  document.querySelectorAll('input, textarea, select').forEach(el=>{
    if(el.type !== 'radio' || el.checked){
      data[el.previousElementSibling?.innerText || el.name] = el.value;
    }
  });
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'anamnese.json';
  a.click();
}
</script>

</body>
</html>
