<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
</head>
<body>

<h2>Enviar para o Trello</h2>

<form id="meuForm">
  <input type="text" name="nome" placeholder="Nome" required><br><br>
  <input type="email" name="email" placeholder="Email" required><br><br>
  <textarea name="mensagem" placeholder="Mensagem"></textarea><br><br>
  <button type="submit">Enviar</button>
</form>

<script>
document.getElementById("meuForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());

  await fetch("https://primary-production-bdcbc.up.railway.app/webhook/form-trello", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  alert("Enviado com sucesso!");
});
</script>

</body>
</html>
